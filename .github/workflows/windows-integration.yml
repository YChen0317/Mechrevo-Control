name: Windows integration package
on:
  push:
    branches: [integration/windows-v1]
    paths: ['windows-app/**', 'backend/**', '.github/workflows/windows-integration.yml']
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - shell: pwsh
        run: |
          dotnet publish windows-app/MechrevoControl.Frontend.csproj -c Release -r win-x64 --self-contained true -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive backend/dist/Mechrevo-0.2.0.zip out -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mechrevo-Control-Windows-x64
          path: out/
          if-no-files-found: error
